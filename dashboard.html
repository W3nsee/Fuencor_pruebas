<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Fuencor Inmobiliaria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-layout">

    <!-- MENÚ LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="assets/image_0880c1.png" alt="Logo Fuencor" class="sidebar-logo">
        </div>
        
        <div class="user-info">
            <span id="saludoUsuario">Hola, Usuario</span>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-btn activo" id="navPropiedades">🏠 Propiedades</button>
            <button class="nav-btn" id="navAgentes" style="display: none;">🛡️ Agentes (Admin)</button>
        </nav>

        <div class="sidebar-footer">
            <button id="btnCerrarSesion" class="nav-btn salir">🚪 Cerrar Sesión</button>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        
        <!-- SECCIÓN DE PROPIEDADES -->
        <section id="seccionPropiedades" class="seccion-activa">
            <div class="dashboard-header">
                <h2>Inventario de Propiedades</h2>
                <button id="btnNuevaPropiedad" class="btn-rojo">+ Registrar Casa</button>
            </div>
            <div class="grid-propiedades" id="listaPropiedades"></div>
        </section>

        <!-- SECCIÓN DE AGENTES (Solo Admin) -->
        <section id="seccionAgentes" class="seccion-oculta">
            <div class="dashboard-header">
                <h2>Gestión de Agentes</h2>
            </div>
            <div class="panel-admin">
                <p>Registra nuevos agentes para darles acceso al portal.</p>
                <form id="formNuevoAgente" class="form-agente">
                    <input type="email" id="nuevoCorreo" placeholder="Correo del agente" required>
                    <input type="text" id="nuevaPass" placeholder="Contraseña temporal" required>
                    <button type="submit" class="btn-rojo">Crear Agente</button>
                </form>
            </div>
        </section>

    </main>

    <!-- VENTANA MODAL AVANZADA PARA REGISTRAR CASAS -->
    <div id="modalRegistro" class="modal">
        <div class="modal-content modal-largo">
            <span class="cerrar-modal">&times;</span>
            <h2>Registrar Nueva Propiedad</h2>
            
            <form id="formPropiedad" class="form-grid">
                <!-- Columna Izquierda: Datos -->
                <div class="form-columna">
                    <div class="input-group">
                        <label>Título de la Propiedad</label>
                        <input type="text" id="tituloCasa" required>
                    </div>
                    <div class="input-group">
                        <label>Precio (MXN)</label>
                        <input type="number" id="precioCasa" required>
                    </div>
                    <div class="input-group">
                        <label>Detalles Rápidos (Ej. 3 Recámaras • 2 Baños)</label>
                        <input type="text" id="detallesCasa" required>
                    </div>
                    <div class="input-group">
                        <label>Descripción Completa</label>
                        <textarea id="descCasa" rows="4" placeholder="Describe los espacios, acabados, ubicación..." required></textarea>
                    </div>
                </div>

                <!-- Columna Derecha: Fotos -->
                <div class="form-columna">
                    <div class="input-group">
                        <label>Fotografías</label>
                        <input type="file" id="inputFotos" multiple accept="image/*">
                        <small>Sube varias fotos. Haz clic en una imagen abajo para marcarla como Portada.</small>
                    </div>
                    
                    <!-- Previsualizador de imágenes -->
                    <div id="previewFotos" class="preview-container">
                        <!-- Las fotos aparecerán aquí mediante JS -->
                    </div>
                </div>

                <div class="form-footer">
                    <button type="submit" class="btn-rojo btn-ancho">Guardar Propiedad Completa</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
