<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuencor Inmobiliaria - Acceso Agentes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="assets/image_0880c1.png" alt="Logo Fuencor Inmobiliaria" class="logo">
            </div>
            
            <h2>Portal de Agentes</h2>
            <p>Inicia sesión para gestionar propiedades</p>

            <div id="alertaPersonalizada" class="alerta oculta"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="usuario">Usuario / Agente</label>
                    <input type="text" id="usuario" placeholder="Ej. ADMIN" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-rojo">Entrar al Sistema</button>
            </form>
            
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
